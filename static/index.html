<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portefeuille">
<title>Portefeuille Pokémon</title>
<style>
:root{
  --ink:#0E1220; --panel:#161C31; --panel2:#1E2540; --line:#2A3352;
  --text:#E8ECF7; --muted:#8C97B8; --gain:#4ADE9B; --loss:#FF7A6B;
  --gold:#E8B75A; --blue:#6BA8FF; --violet:#B36BFF;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;
  background-attachment:fixed;
  background-image:radial-gradient(900px 500px at 15% -10%, rgba(107,168,255,.10) 0%, transparent 60%),
                     radial-gradient(700px 400px at 95% 0%, rgba(179,107,255,.08) 0%, transparent 55%);}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- header ---- */
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:16px;margin:0;letter-spacing:-.01em;font-weight:650}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:var(--r);
  font-size:13px;transition:border-color .15s,background .15s}
.btn:hover{border-color:#3D4A73;background:#232B49}
.btn.primary{background:linear-gradient(180deg,#2E4A8C,#22386C);border-color:#3E5EA8}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--loss);color:var(--loss)}

/* ---- hero ---- */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(100deg,#7DE2FC,#B36BFF,#FF9BD2,#7DE2FC);background-size:300% 100%;animation:sheen 9s linear infinite}
@keyframes sheen{to{background-position:300% 0}}
.hero-grid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.1fr);gap:24px;align-items:end}
.total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(34px,7vw,54px);font-weight:700;line-height:1;
  letter-spacing:-.03em;margin:6px 0 10px;
  background:linear-gradient(100deg,#7DE2FC,#B36BFF,#FF9BD2,#7DE2FC);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s linear infinite}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;margin-top:2px}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.chart{width:100%;height:120px;display:block}
.chart-empty{color:var(--muted);font-size:12.5px;border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center}

/* ---- filters ---- */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:20px 0 10px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:999px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--panel2);color:var(--text);border-color:#44548A}
.search{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;min-width:180px}

/* ---- table ---- */
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) .8fr .5fr .9fr 1fr 1.05fr .9fr;gap:12px;padding:12px 16px;align-items:center;
  border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row.head{background:var(--panel2);position:sticky;top:0;z-index:2}
.row.head span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row.item{cursor:pointer;transition:background .12s}
.row.item:hover{background:#1A2138}
.name{min-width:0}
.name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;border:1px solid}
.t-scelle{color:var(--gold);border-color:rgba(232,183,90,.35);background:rgba(232,183,90,.08)}
.t-loose{color:var(--blue);border-color:rgba(107,168,255,.35);background:rgba(107,168,255,.08)}
.t-gradee{color:var(--violet);border-color:rgba(179,107,255,.35);background:rgba(179,107,255,.08)}
.right{text-align:right}
.dim{color:var(--muted)}
.pru-flag{font-size:10px;color:var(--muted);font-family:var(--mono)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:15px}

/* ---- modal / drawer ---- */
.backdrop{position:fixed;inset:0;background:rgba(6,9,18,.72);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--panel);border-left:1px solid var(--line);width:min(560px,100%);height:100%;overflow-y:auto;padding:22px}
.sheet.center{margin:auto;border:1px solid var(--line);border-radius:16px;height:auto;max-height:92vh;width:min(520px,94%)}
.sheet h2{margin:2px 0 2px;font-size:19px;letter-spacing:-.01em}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}
label{display:block;margin-bottom:12px}
label .lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:hover,select:hover{border-color:#3D4A73}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ---- estimation block (signature) ---- */
.est{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
.est-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.est-val{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.conf{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid}
.c-haute{color:var(--gain);border-color:rgba(74,222,155,.4)}
.c-moyenne{color:var(--gold);border-color:rgba(232,183,90,.4)}
.c-faible{color:var(--loss);border-color:rgba(255,122,107,.4)}
.axis{position:relative;height:64px;margin:2px 0 6px}
.axis .line{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--line)}
.dot{position:absolute;top:34px;transform:translate(-50%,-50%);border-radius:50%;background:var(--blue);border:1px solid #0E1220}
.dot.out{background:#3A4468}
.marker{position:absolute;top:16px;bottom:8px;width:2px;background:var(--gain);transform:translateX(-50%)}
.marker::after{content:"est.";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--gain);letter-spacing:.1em}
.axis .lbl{position:absolute;top:46px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.comp{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.comp .p{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.comp.excluded{opacity:.45}
.w{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{color:var(--loss);background:rgba(255,122,107,.1)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.warn{background:rgba(232,183,90,.1);border:1px solid rgba(232,183,90,.35);color:var(--gold);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}

.modes{display:flex;gap:6px;margin:22px 0 0}
.chip.big{padding:9px 16px;font-size:13.5px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:14px 0 0}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--muted)}
.hist{width:100%;height:112px;display:block;margin:6px 0 2px}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
.b-up{color:var(--gain);border-color:rgba(74,222,155,.4)}
.b-down{color:var(--loss);border-color:rgba(255,122,107,.4)}
.b-flat{color:var(--muted);border-color:var(--line)}
.row.watch{grid-template-columns:minmax(0,2.4fr) .8fr 1fr 1fr 1fr 1.1fr}
@media (max-width:860px){
  .row.watch{grid-template-columns:1fr 1fr}
  .hero-grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr 1fr;gap:4px 12px;padding:14px 14px}
  .row.head{display:none}
  .row .name{grid-column:1 / -1}
  .row .cell::before{content:attr(data-l) " ";font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);display:block}
  .right{text-align:left}
  .f3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <h1>Portefeuille Pokémon</h1>
    <span class="eyebrow" id="stamp">connexion…</span>
  </div>
  <div class="toolbar">
    <button class="btn primary" data-action="new-item">+ Ajouter un item</button>
    <button class="btn" data-action="snapshot">Enregistrer un point</button>
    <button class="btn ghost" data-action="settings">Réglages</button>
    <button class="btn ghost" data-action="export">Exporter</button>
    <button class="btn ghost" data-action="import">Importer</button>
    <button class="btn ghost" data-action="logout">Déconnexion</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>

<div id="storage-warn"></div>

<section class="hero">
  <div class="hero-grid">
    <div>
      <span class="eyebrow">Valeur estimée du portefeuille</span>
      <div class="total num" id="total">—</div>
      <div class="kpis">
        <div class="kpi"><span class="eyebrow">Investi</span><div class="v num" id="invested">—</div></div>
        <div class="kpi"><span class="eyebrow">Plus-value</span><div class="v num" id="pnl">—</div></div>
        <div class="kpi"><span class="eyebrow">Net de frais</span><div class="v num" id="net">—</div></div>
        <div class="kpi"><span class="eyebrow">Items</span><div class="v num" id="count">—</div></div>
      </div>
    </div>
    <div>
      <span class="eyebrow">Progression</span>
      <div id="chart-host"></div>
    </div>
  </div>
</section>

<div class="modes">
  <button class="chip big" data-mode="owned" aria-pressed="true">Portefeuille</button>
  <button class="chip big" data-mode="watch" aria-pressed="false">Veille <span id="watch-count"></span></button>
  <button class="chip big" data-mode="deals" aria-pressed="false">Achat-revente</button>
</div>

<div class="filters" id="filters-items">
  <button class="chip" data-filter="all" aria-pressed="true">Tout</button>
  <button class="chip" data-filter="scelle" aria-pressed="false">Scellé</button>
  <button class="chip" data-filter="loose" aria-pressed="false">Loose</button>
  <button class="chip" data-filter="gradee" aria-pressed="false">Gradée</button>
  <input class="search" id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher un item">
</div>
<div class="filters" id="deal-toolbar" style="display:none">
  <button class="btn primary" data-action="new-deal">+ Nouvelle opération</button>
  <button class="btn ghost" data-action="deal-settings">Paramètres achat-revente</button>
</div>

<div class="rows" id="rows"></div>

</div>

<div id="overlay"></div>

<script>
"use strict";

const TYPES = {scelle:"Scellé", loose:"Loose", gradee:"Gradée"};
let S = null, filter = "all", query = "", openItem = null, mode = "owned";
let deals = null, dealParams = null;
const SELL_PLATFORMS = {ebay:"eBay", vinted:"Vinted", cardmarket:"Cardmarket"};

async function loadDeals(){
  const r = await api("/api/deals");
  deals = r.deals; dealParams = r.params;
}

/* ---------------- accès API ---------------- */
async function api(path, opts={}){
  const o = {headers:{}, credentials:"same-origin", ...opts};
  if(o.json){ o.method = o.method||"POST"; o.headers["Content-Type"]="application/json";
    o.body = JSON.stringify(o.json); delete o.json; }
  const r = await fetch(path, o);
  if(r.status===401){ location.reload(); throw new Error("401"); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.status===204 ? null : r.json();
}
async function refresh(){
  try{
    S = await api("/api/state");
    document.getElementById("storage-warn").innerHTML = "";
    render();
  }catch(e){
    if(e.message!=="401") document.getElementById("storage-warn").innerHTML =
      `<div class="warn">Serveur injoignable. Vérifie qu'il tourne et que l'appareil est sur le même réseau.</div>`;
  }
}

/* ---------------- formats ---------------- */
const eur = n => (n==null||isNaN(n)) ? "—" : new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:2}).format(n);
const pct = n => (n==null||isNaN(n)) ? "—" : (n>=0?"+":"") + n.toFixed(1).replace(".",",") + " %";
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"2-digit"});
const srcLabel = k => S?.sources?.[k]?.label || k;

/* ---------------- rendu ---------------- */
function render(){
  const t = S.totals;
  document.getElementById("total").textContent = eur(t.value);
  document.getElementById("invested").textContent = eur(t.invested);
  document.getElementById("count").textContent = t.units;
  const p = document.getElementById("pnl");
  p.textContent = eur(t.pnl) + (t.invested ? ` (${pct(t.pnl/t.invested*100)})` : "");
  p.className = "v num " + (t.pnl>=0?"gain":"loss");
  const n = document.getElementById("net");
  n.textContent = eur(t.net); n.className = "v num " + (t.net>=0?"gain":"loss");
  document.getElementById("chart-host").innerHTML = chartSVG();
  document.getElementById("stamp").textContent = S.items.length + " items · synchronisé";
  renderRows();
}
function chartSVG(){
  const s = S.snapshots;
  if(s.length<2) return `<div class="chart-empty">Deux points suffisent pour tracer la courbe. Reviens demain, ou clique « Enregistrer un point ».</div>`;
  const W=520,H=120,P=6;
  const vals = s.flatMap(p=>[p.value,p.invested]);
  const lo = Math.min(...vals)*0.97, hi = Math.max(...vals)*1.03 || 1;
  const x = i => P + i*(W-2*P)/(s.length-1);
  const y = v => H-P - (v-lo)/((hi-lo)||1)*(H-2*P);
  const path = k => s.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(" ");
  const area = path("value") + ` L${x(s.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
  const diff = s[s.length-1].value - s[0].value;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du portefeuille">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BA8FF" stop-opacity=".35"/><stop offset="100%" stop-color="#6BA8FF" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${path("invested")}" fill="none" stroke="#3A4468" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="${path("value")}" fill="none" stroke="#6BA8FF" stroke-width="2"/>
    <circle cx="${x(s.length-1).toFixed(1)}" cy="${y(s[s.length-1].value).toFixed(1)}" r="3.5" fill="#7DE2FC"/>
  </svg>
  <div class="eyebrow" style="margin-top:6px">${s.length} points · depuis le ${fr(s[0].d)} : <span class="${diff>=0?'gain':'loss'}">${eur(diff)}</span> · tirets = investi</div>`;
}
function trendBadge(v, suffix="%"){
  if(v==null) return `<span class="badge b-flat">—</span>`;
  const c = v>2 ? "b-up" : v<-2 ? "b-down" : "b-flat";
  const arrow = v>2 ? "↑" : v<-2 ? "↓" : "→";
  return `<span class="badge ${c}">${arrow} ${(v>=0?"+":"")}${v.toFixed(1).replace(".",",")}${suffix}</span>`;
}
const sales = v => v==null ? "—" : v>=10 ? Math.round(v)+"/mois" : v.toFixed(1).replace(".",",")+"/mois";

function renderDeals(){
  const host = document.getElementById("rows");
  if(!Array.isArray(deals)){ host.innerHTML = `<div class="empty">Chargement…</div>`; return; }
  if(!deals.length){
    host.innerHTML = `<div class="empty"><b>Aucune opération</b>
      Décris un achat en cours (lot ou carte isolée) pour voir le bénéfice net et le prix plancher par plateforme avant de te décider.
      <div style="margin-top:14px"><button class="btn primary" data-action="new-deal">+ Nouvelle opération</button></div></div>`;
    return;
  }
  host.innerHTML = deals.map(d=>{
    const c = d.computed, best = c.best;
    const name = d.item_id ? (S.items.find(i=>i.id===d.item_id)?.name || d.name || "Item lié") : (d.name || "Sans nom");
    const doneTag = d.status==="done" ? `<span class="tag" style="color:var(--gain);border-color:rgba(74,222,155,.4);margin-left:6px">Réalisée</span>` : "";
    const detail = c.results.length ? `
      <details style="margin-top:10px">
        <summary class="eyebrow" style="cursor:pointer">Détail du calcul</summary>
        <div style="margin-top:8px;font-size:13px">
          <div class="dim" style="margin-bottom:4px">Coût de revient débarqué</div>
          <div class="comp" style="grid-template-columns:1fr auto"><span>Prix article + port</span><span class="p">${eur(c.cost.lot_price+c.cost.lot_shipping)}</span></div>
          ${c.cost.is_import?`
          <div class="comp" style="grid-template-columns:1fr auto"><span>TVA import (${c.cost.vat_rate_pct}%)</span><span class="p">${eur(c.cost.vat_import)}</span></div>
          <div class="comp" style="grid-template-columns:1fr auto"><span>Douane (${c.cost.duty_rate_pct}%)</span><span class="p">${eur(c.cost.duty)}</span></div>
          <div class="comp" style="grid-template-columns:1fr auto"><span>Frais de dossier${c.cost.is_ioss?" (neutralisés IOSS)":""}</span><span class="p">${eur(c.cost.carrier_fee)}</span></div>`:""}
          <div class="comp" style="grid-template-columns:1fr auto"><span><b>Total lot</b></span><span class="p"><b>${eur(c.cost.total_lot)}</b></span></div>
          <div class="comp" style="grid-template-columns:1fr auto"><span><b>Coût / unité (${c.cost.qty})</b></span><span class="p"><b>${eur(c.cost.per_unit)}</b></span></div>
          <div class="dim" style="margin:10px 0 4px">Net par plateforme</div>
          ${c.results.map(r=>`
            <div class="comp" style="grid-template-columns:1fr auto">
              <span>${esc(r.label)} — vente ${eur(r.price)}${r.commission?`, commission ${eur(r.commission)}`:""}${r.shipping_out?`, port ${eur(r.shipping_out)}`:""}${r.packaging?`, emballage ${eur(r.packaging)}`:""}</span>
              <span class="p ${r.benefice>=0?"gain":"loss"}">${eur(r.net)}</span>
            </div>
            <div class="dim" style="font-size:11px;margin:-4px 0 6px">bénéfice ${eur(r.benefice)} (${pct(r.benefice_pct)}) · plancher ${eur(r.floor_price)}</div>
          `).join("")}
        </div>
      </details>` : `<p class="note">Ajoute un prix de revente visé (eBay, Vinted ou Cardmarket) pour voir le bénéfice.</p>`;
    return `<div class="rows" style="margin-bottom:10px">
      <div style="padding:14px 16px">

/* ---------------- panneaux ---------------- */
function historyChart(item){
  const pts = item.est.points.filter(p=>p.price>0);
  if(pts.length<2) return "";
  const W=480,H=112,PL=4,PT=10,PB=16;
  const maxAge = Math.max(...pts.map(p=>daysAgo(p.date)), 1);
  const vals = pts.map(p=>p.price).concat(item.target_price?[item.target_price]:[]);
  const lo = Math.min(...vals)*0.96, hi = Math.max(...vals)*1.04 || 1;
  const x = age => W-PL - (age/maxAge)*(W-2*PL);
  const y = v => H-PB - (v-lo)/((hi-lo)||1)*(H-PT-PB);
  const fit = item.stats.fit;
  const trend = fit ? `<line x1="${x(maxAge).toFixed(1)}" y1="${y(fit.now + fit.slope*(-maxAge)).toFixed(1)}"
      x2="${x(0).toFixed(1)}" y2="${y(fit.now).toFixed(1)}" stroke="#6BA8FF" stroke-width="1.5" opacity=".8"/>` : "";
  const target = item.target_price ? `<line x1="0" y1="${y(item.target_price).toFixed(1)}" x2="${W}" y2="${y(item.target_price).toFixed(1)}"
      stroke="#E8B75A" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>` : "";
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Historique des relevés de prix">
    ${target}${trend}
    ${pts.map(p=>`<circle cx="${x(daysAgo(p.date)).toFixed(1)}" cy="${y(p.price).toFixed(1)}" r="${3+Math.min(3,((p.sold_count||1)-1)*0.6)}"
      fill="${p.out||p.excluded?"#3A4468":"#7DE2FC"}"/>`).join("")}
  </svg>
  <div class="eyebrow" style="display:flex;justify-content:space-between">
    <span>il y a ${Math.round(maxAge)} j</span>${item.target_price?'<span style="color:var(--gold)">— — objectif</span>':""}<span>aujourd'hui</span></div>`;
}
const daysAgo = d => Math.max(0,(Date.now()-new Date(d+"T12:00:00").getTime())/864e5);

function statsBlock(item){
  const st = item.stats;
  const cell = (lb, val, sub) => `<div class="stat"><span class="eyebrow">${lb}</span><div class="v">${val}</div>
    ${sub?`<div class="s">${sub}</div>`:""}</div>`;
  return `<div class="stats">
    ${cell("Tendance 30j", trendBadge(st.trend30), st.trend30==null?"pas assez de recul":"vs les 60 j précédents")}
    ${cell("Rythme", trendBadge(st.slope_pct), st.slope_pct==null?"série trop courte":"pente sur 180 j")}
    ${cell("Ça part ?", sales(st.sales_month), st.sales_90?`${st.sales_90} ventes relevées sur 90 j`:"aucune vente relevée")}
    ${cell("Dispersion", st.spread==null?"—":Math.round(st.spread)+" %", st.low90!=null?`${eur(st.low90)} → ${eur(st.high90)}`:"")}
  </div>`;
}

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center">

          <div style="position:relative;width:64px;height:64px">
            <a href="${p.url}" target="_blank" style="display:block;width:100%;height:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line)">
              <img src="${p.thumb_url}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
            </a>
            <button class="x" data-del-deal-photo="${p.id}" data-deal-owner="${d.id}" title="Supprimer" style="position:absolute;top:-6px;right:-6px;background:var(--panel);border:1px solid var(--line);border-radius:50%;width:20px;height:20px;padding:0;line-height:18px;font-size:11px">✕</button>
            ${idx>0?`<button class="x" data-deal-photo-up="${p.id}" data-deal-owner="${d.id}" title="Vers le début" style="position:absolute;bottom:-6px;left:-6px;background:var(--panel);border:1px solid var(--line);border-radius:50%;width:20px;height:20px;padding:0;line-height:18px;font-size:11px">←</button>`:''}
          </div>`).join("")}
        ${photos.length < 8 ? `
          <label style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;cursor:pointer;color:var(--muted);font-size:20px;margin:0" title="Ajouter des photos">
            +
            <input id="deal-photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple data-deal="${d.id}" hidden>
          </label>` : ''}
      </div>
    </div>`;
}

function dealForm(id){

  const rp = d?.resale_prices || {};
  openSheet(`
    <div class="sheet-head"><div><span class="eyebrow">${d?"Modifier":"Nouvelle"} opération</span>
      <h2>${d?esc(d.name||"Opération"):"Achat-revente"}</h2></div>
      <button class="btn ghost" data-close-btn>Fermer</button></div>

    <label><span class="lb">Item lié (optionnel)</span>
      <select id="d-item">
        <option value="">— Saisie libre —</option>
        ${(S?.items||[]).map(i=>`<option value="${i.id}" ${d?.item_id===i.id?"selected":""}>${esc(i.name)}</option>`).join("")}
      </select>
    </label>
    <div class="f2">
      <label><span class="lb">Nom (si pas de lien)</span><input id="d-name" value="${esc(d?.name||"")}" placeholder="Lot 10 cartes SV Japon"></label>
      <label><span class="lb">Type</span><select id="d-type">
        ${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${d?.type===k?"selected":""}>${l}</option>`).join("")}
      </select></label>
    </div>
    <div class="f3">
      <label><span class="lb">Langue</span><input id="d-lang" value="${esc(d?.lang||"")}" placeholder="JP"></label>
      <label><span class="lb">Grade</span><input id="d-grade" value="${esc(d?.grade||"")}" placeholder="facultatif"></label>
      <label><span class="lb">Plateforme d'achat</span><select id="d-platform">
        ${["vinted","ebay","cardmarket","japan_proxy","autre"].map(p=>`<option value="${p}" ${d?.platform===p?"selected":""}>${p}</option>`).join("")}
      </select></label>
    </div>
    <hr class="sep">
    <div class="f3">
      <label><span class="lb">Prix du lot (total)</span><input id="d-price" type="number" step="0.01" min="0" value="${d?.lot_price??""}"></label>
      <label><span class="lb">Port (achat)</span><input id="d-ship" type="number" step="0.01" min="0" value="${d?.lot_shipping??0}"></label>
      <label><span class="lb">Quantité (lot)</span><input id="d-qty" type="number" min="1" step="1" value="${d?.qty??1}"></label>
    </div>
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="d-import" ${d?.is_import?"checked":""} style="width:auto"> <span>Achat hors UE (déclenche TVA + douane)</span></label>
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="d-ioss" ${d?.is_ioss?"checked":""} style="width:auto"> <span>Sous IOSS (&lt; ${dealParams?.ioss_threshold??150}€, TVA déjà payée à l'achat)</span></label>
    <label><span class="lb">Répartition du coût sur le lot</span><select id="d-split">
      <option value="value" ${d?.split_mode!=="equal"?"selected":""}>Au prorata de la valeur</option>
      <option value="equal" ${d?.split_mode==="equal"?"selected":""}>Parts égales</option>
    </select></label>
    <p class="note">Avec un seul prix pour tout le lot, les deux modes donnent le même coût par unité. La distinction ne jouera que le jour où tu détailleras un prix de revente différent par carte du lot.</p>
    <hr class="sep">
    <span class="eyebrow">Revente visée (vide = reprend l'estimation de l'item lié)</span>
    <div class="f3" style="margin-top:8px">
      <label><span class="lb">eBay</span><input id="d-rp-ebay" type="number" step="0.01" min="0" value="${rp.ebay??""}"></label>
      <label><span class="lb">Vinted</span><input id="d-rp-vinted" type="number" step="0.01" min="0" value="${rp.vinted??""}"></label>
      <label><span class="lb">Cardmarket</span><input id="d-rp-cardmarket" type="number" step="0.01" min="0" value="${rp.cardmarket??""}"></label>
    </div>
    <div class="f3">
      <label><span class="lb">Port sortant</span><input id="d-ship-out" type="number" step="0.01" min="0" value="${d?.resale_shipping_out??0}"></label>
      <label><span class="lb">Emballage</span><input id="d-pack" type="number" step="0.01" min="0" value="${d?.packaging_cost??0}"></label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:26px"><input type="checkbox" id="d-buyer-ship" ${d?.buyer_pays_shipping?"checked":""} style="width:auto"> <span>Port à charge acheteur (eBay)</span></label>
    </div>
    <label><span class="lb">Notes</span><textarea id="d-notes" rows="2">${esc(d?.notes||"")}</textarea></label>

function dealSettingsForm(){
  const p = dealParams;
  openSheet(`
    <div class="sheet-head"><div><span class="eyebrow">Réglages</span><h2>Achat-revente</h2></div>
      <button class="btn ghost" data-close-btn>Fermer</button></div>
    <div class="f3">
      <label><span class="lb">TVA import (%)</span><input id="dp-vat" type="number" min="0" step="0.5" value="${p.vat_rate}"></label>
      <label><span class="lb">Droits de douane (%)</span><input id="dp-duty" type="number" min="0" step="0.5" value="${p.duty_rate}"></label>
      <label><span class="lb">Frais de dossier (€)</span><input id="dp-carrier" type="number" min="0" step="1" value="${p.carrier_fee}"></label>

/* ---------------- actions ---------------- */
document.addEventListener("click", async ev=>{
  const t = ev.target;
  try{
    const act = t.closest("[data-action]")?.dataset.action;
    if(act==="new-item") return itemForm(null);
    if(act==="settings") return settingsForm();
    if(act==="snapshot"){ await api("/api/snapshot",{method:"POST"}); return refresh(); }
    if(act==="export"){
      const data = await api("/api/export");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
      a.download = `portefeuille-pokemon-${today()}.json`; a.click(); URL.revokeObjectURL(a.href); return;
    }
    if(act==="import") return document.getElementById("file").click();

    if(act==="logout"){ await api("/api/logout",{method:"POST"}); return location.reload(); }
    if(t.closest("[data-close-btn]") || t.hasAttribute("data-close")) return closeSheet();

    const open = t.closest("[data-open]");
    if(open) return itemSheet(open.dataset.open);

    const si = t.closest("[data-save-item]");
    if(si){
      const g = x => document.getElementById(x).value.trim();
      if(!g("f-name")) return document.getElementById("f-name").focus();
      const body = {name:g("f-name"), type:g("f-type"), lang:g("f-lang"), grade:g("f-grade"),
        set_name:g("f-set"), qty:g("f-qty"), buy_price:g("f-buy"), buy_date:g("f-date"), notes:g("f-notes"),
        status:g("f-status"), target_price:g("f-target")};
      const id = si.dataset.saveItem;
      await api(id==="new" ? "/api/items" : "/api/items/"+id, {json:body, method: id==="new"?"POST":"PUT"});
      closeSheet(); return refresh();
    }
    const ed = t.closest("[data-edit-item]"); if(ed) return itemForm(ed.dataset.editItem);

    const bu = t.closest("[data-buy]"); if(bu) return buyForm(bu.dataset.buy);
    const sb = t.closest("[data-save-buy]");
    if(sb){
      await api(`/api/items/${sb.dataset.saveBuy}/buy`, {json:{buy_price:document.getElementById("b-price").value,
        qty:document.getElementById("b-qty").value, buy_date:document.getElementById("b-date").value}});
      closeSheet(); mode = "owned";
      document.querySelectorAll("[data-mode]").forEach(c=>c.setAttribute("aria-pressed", c.dataset.mode==="owned"));
      return refresh();
    }
    const ub = t.closest("[data-unbuy]");
    if(ub){ await api(`/api/items/${ub.dataset.unbuy}/watch`,{method:"POST"}); closeSheet(); return refresh(); }

    const di = t.closest("[data-del-item]");
    if(di){
      if(!confirm("Supprimer cet item et ses relevés ?")) return;
      await api("/api/items/"+di.dataset.delItem,{method:"DELETE"}); closeSheet(); return refresh();
    }
    const ac = t.closest("[data-add-comp]");
    if(ac){
      const price = document.getElementById("c-price").value;
      if(!(parseFloat(price)>0)) return document.getElementById("c-price").focus();
      await api(`/api/items/${ac.dataset.addComp}/comps`, {json:{price,
        shipping:document.getElementById("c-ship").value || 0,
        date:document.getElementById("c-date").value,
        source:document.getElementById("c-source").value, note:document.getElementById("c-note").value.trim(),
        sold_count:document.getElementById("c-count").value}});
      await refresh(); return itemSheet(ac.dataset.addComp);
    }
    const tg = t.closest("[data-toggle-comp]");
    if(tg){ await api("/api/comps/"+tg.dataset.toggleComp,{method:"PATCH"}); const k=openItem; await refresh(); return itemSheet(k); }

    const dc = t.closest("[data-del-comp]");
    if(dc){ await api("/api/comps/"+dc.dataset.delComp,{method:"DELETE"}); const k=openItem; await refresh(); return itemSheet(k); }

    // --- Photos ---
    const dp = t.closest("[data-del-photo]");
    if(dp){
      if(!confirm("Supprimer cette photo ?")) return;
      await api(`/api/items/${openItem}/photos/${dp.dataset.delPhoto}`,{method:"DELETE"});
      await refresh(); return itemSheet(openItem);
    }
    const up = t.closest("[data-photo-up]");
    if(up){
      const item = S.items.find(x=>x.id===openItem); if(!item) return;
      const ids = (item.photos||[]).map(p=>p.id);
      const i0 = ids.indexOf(up.dataset.photoUp);
      if(i0>0){ ids.splice(i0,1); ids.unshift(up.dataset.photoUp); }
      await api(`/api/items/${openItem}/photos/order`,{method:"PUT", json:{order:ids}});
      await refresh(); return itemSheet(openItem);
    }

    if(t.closest("[data-save-settings]")){
      const weights = {};
      document.querySelectorAll("[data-w]").forEach(el=> weights[el.dataset.w] = el.value);
      await api("/api/settings",{method:"PUT", json:{halfLife:document.getElementById("s-hl").value,
        fees:document.getElementById("s-fee").value, trimK:document.getElementById("s-k").value, weights}});
      closeSheet(); return refresh();
    }

    // --- Achat-revente ---
    if(act==="new-deal") return dealForm(null);
    if(act==="deal-settings") return dealSettingsForm();
    const edD = t.closest("[data-edit-deal]"); if(edD) return dealForm(edD.dataset.editDeal);

    const sd = t.closest("[data-save-deal]");
    if(sd){
      const g = x => document.getElementById(x).value.trim();
      const gc = x => document.getElementById(x).checked;
      const resale_prices = {};
      ["ebay","vinted","cardmarket"].forEach(k=>{
        const v = g(`d-rp-${k}`); if(v) resale_prices[k] = v;
      });
      const body = {
        item_id: g("d-item") || null, name: g("d-name"), type: g("d-type"),
        lang: g("d-lang"), grade: g("d-grade"), platform: g("d-platform"),
        lot_price: g("d-price"), lot_shipping: g("d-ship"), qty: g("d-qty"),
        is_import: gc("d-import"), is_ioss: gc("d-ioss"), split_mode: g("d-split"),
        resale_prices, resale_shipping_out: g("d-ship-out"), packaging_cost: g("d-pack"),
        buyer_pays_shipping: gc("d-buyer-ship"), notes: g("d-notes"),
      };
      const id = sd.dataset.saveDeal;
      const saved = id ? await api("/api/deals/"+id, {json:body, method:"PUT"})
                        : await api("/api/deals", {json:body, method:"POST"});
      await loadDeals(); closeSheet(); return renderRows();
    }
    const dd = t.closest("[data-del-deal]");
    if(dd){
      if(!confirm("Supprimer cette opération ?")) return;
      await api("/api/deals/"+dd.dataset.delDeal,{method:"DELETE"});
      await loadDeals(); closeSheet(); return renderRows();
    }
    const rd = t.closest("[data-realize-deal]");
    if(rd){
      if(!confirm("Marquer réalisée ? L'item bascule au portefeuille avec le coût de revient comme prix d'achat.")) return;
      await api(`/api/deals/${rd.dataset.realizeDeal}/realize`,{method:"POST"});
      await Promise.all([loadDeals(), refresh()]); return renderRows();
    }
    const sdp = t.closest("[data-save-deal-params]");
    if(sdp){
      const platform_fees = {};
      document.querySelectorAll("[data-pf-pct]").forEach(el=>{
        platform_fees[el.dataset.pfPct] = {...(platform_fees[el.dataset.pfPct]||{}), pct: el.value};
      });
      document.querySelectorAll("[data-pf-fixed]").forEach(el=>{
        platform_fees[el.dataset.pfFixed] = {...(platform_fees[el.dataset.pfFixed]||{}), fixed: el.value};
      });
      await api("/api/deal-params",{method:"PUT", json:{
        vat_rate:document.getElementById("dp-vat").value,
        duty_rate:document.getElementById("dp-duty").value,
        carrier_fee:document.getElementById("dp-carrier").value,
        ioss_threshold:document.getElementById("dp-ioss").value,
        platform_fees,
      }});
      await loadDeals(); closeSheet(); return renderRows();
    }
    const ddp = t.closest("[data-del-deal-photo]");
    if(ddp){
      if(!confirm("Supprimer cette photo ?")) return;
      await api(`/api/deals/${ddp.dataset.dealOwner}/photos/${ddp.dataset.delDealPhoto}`,{method:"DELETE"});
      await loadDeals(); return dealForm(ddp.dataset.dealOwner);
    }
    const dpu = t.closest("[data-deal-photo-up]");
    if(dpu){
      const did = dpu.dataset.dealOwner;
      const deal = deals.find(x=>x.id===did); if(!deal) return;
      const ids = (deal.photos||[]).map(p=>p.id);
      const i0 = ids.indexOf(dpu.dataset.dealPhotoUp);
      if(i0>0){ ids.splice(i0,1); ids.unshift(dpu.dataset.dealPhotoUp); }
      await api(`/api/deals/${did}/photos/order`,{method:"PUT", json:{order:ids}});
      await loadDeals(); return dealForm(did);
    }

    const mchip = t.closest("[data-mode]");
    if(mchip){
      mode = mchip.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach(c=>c.setAttribute("aria-pressed", c===mchip));
      document.getElementById("filters-items").style.display = mode==="deals" ? "none" : "flex";
      document.getElementById("deal-toolbar").style.display = mode==="deals" ? "flex" : "none";
      if(mode==="deals" && !deals) await loadDeals();
      return renderRows();
    }
    const chip = t.closest("[data-filter]");
    if(chip){
      filter = chip.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(c=>c.setAttribute("aria-pressed", c===chip));
      renderRows();
    }
  }catch(err){ if(err.message!=="401") alert("Échec : "+err.message); }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target.closest(".sheet") && e.target.tagName==="INPUT"){
    const b = document.querySelector(".sheet .btn.primary"); if(b) b.click();
  }
  const row = e.target.closest("[data-open]");
  if(row && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); itemSheet(row.dataset.open); }
});
document.getElementById("search").addEventListener("input", e=>{ query = e.target.value.toLowerCase().trim(); if(S) renderRows(); });
document.getElementById("file").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  const fd = new FormData(); fd.append("file", f);
  try{
    if(!confirm("L'import remplace le contenu actuel de la base. Continuer ?")) return;
    await api("/api/import",{method:"POST", body:fd}); await refresh();
  }catch(err){ alert("Import impossible : "+err.message); }
  finally{ e.target.value=""; }
});
// Upload de photos depuis la fiche item (le <input id="photo-file"> vit dans la sheet).
// Delegation via document pour capturer les changes des inputs re-rendus.
document.addEventListener("change", async e=>{
  if(e.target.id!=="photo-file") return;
  const iid = e.target.dataset.item;
  const files = Array.from(e.target.files||[]);
  e.target.value = "";
  if(!files.length || !iid) return;
  try{
    for(const f of files){
      if(f.size > 10*1024*1024){ alert(`${f.name} > 10 Mo, ignoré`); continue; }
      const fd = new FormData(); fd.append("file", f);
      await api(`/api/items/${iid}/photos`,{method:"POST", body:fd});
    }
    await refresh(); return itemSheet(iid);
  }catch(err){ alert("Upload impossible : "+err.message); }
});

document.addEventListener("change", async e=>{
  if(e.target.id!=="deal-photo-file") return;
  const did = e.target.dataset.deal;
  const files = Array.from(e.target.files||[]);
  e.target.value = "";
  if(!files.length || !did) return;
  try{
    for(const f of files){
      if(f.size > 10*1024*1024){ alert(`${f.name} > 10 Mo, ignoré`); continue; }
      const fd = new FormData(); fd.append("file", f);
      await api(`/api/deals/${did}/photos`,{method:"POST", body:fd});
    }
    await loadDeals(); return dealForm(did);
  }catch(err){ alert("Upload impossible : "+err.message); }
});

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !document.querySelector(".sheet")) refresh(); });

refresh();
</script>
