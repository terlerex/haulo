<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portefeuille">
<title>Portefeuille Pokémon</title>
<style>
:root{
  --ink:#0F1114; --panel:#17191D; --panel2:#1D2024; --line:#24272C;
  --text:#ECEEF1; --muted:#8A8F97; --accent:#3EDC7B; --loss:#FF6B5E;
  --tag-scelle-fg:#D9B54A; --tag-scelle-bg:rgba(217,181,74,.10); --tag-scelle-bd:rgba(217,181,74,.28);
  --tag-loose-fg:#6FA1F5; --tag-loose-bg:rgba(111,161,245,.10); --tag-loose-bd:rgba(111,161,245,.28);
  --tag-gradee-fg:#A98BF0; --tag-gradee-bg:rgba(169,139,240,.10); --tag-gradee-bd:rgba(169,139,240,.28);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gain{color:var(--accent)} .loss{color:var(--loss)}

/* ---- structure ---- */
.appshell{min-height:100dvh;display:flex;flex-direction:column}
header.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

.shell{flex:1;display:flex;min-height:0}
main.content{flex:1;min-width:0;overflow-y:auto;padding:16px 16px calc(148px + env(safe-area-inset-bottom))}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);height:60px}
nav.tabbar button{flex:1;height:100%;min-height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:500}
nav.tabbar button[aria-pressed="true"]{color:var(--accent)}
nav.tabbar .ico{font-size:19px;line-height:1}

/* nav.tabbar .fab (au lieu de .fab seul) : le fab est un <button> DESCENDANT de
   nav.tabbar, donc la règle générique "nav.tabbar button{height:100%; flex:1; ...}"
   ci-dessus (spécificité 0,1,2) écraserait un simple ".fab{...}" (spécificité 0,1,0).
   Sans ce renfort de spécificité, le bouton hérite height:100% et devient un
   élément quasi plein écran sur mobile, qui recouvre le header et bloque le
   menu "⋯" — c'était le bug initial. */
nav.tabbar .fab{position:fixed;right:16px;bottom:calc(60px + env(safe-area-inset-bottom) + 14px);z-index:36;
  width:56px;height:56px;flex:none;border-radius:50%;background:var(--accent);color:#06120B;border:none;
  font-size:26px;display:flex;flex-direction:row;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.4)}
.fab-label{display:none}

@media (min-width:900px){
  .shell{flex-direction:row}
  nav.tabbar{position:static;flex-direction:column;justify-content:flex-start;align-items:stretch;
    width:220px;height:auto;border-top:none;border-right:1px solid var(--line);padding:14px 10px;gap:4px}
  nav.tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 12px;
    border-radius:var(--r-sm);font-size:14px;height:auto;min-height:44px}
  nav.tabbar button[aria-pressed="true"]{background:var(--panel2)}
  nav.tabbar .fab{position:static;margin:0 0 14px;border-radius:var(--r-sm);width:auto;height:44px;
    flex:none;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;font-size:20px;box-shadow:none}
  .fab-label{display:inline;font-size:14px;font-weight:600}
  main.content{padding:24px 28px 40px;max-width:900px}
}

/* ---- hero ---- */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.hero-grid{display:grid;grid-template-columns:1fr;gap:18px}
.total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(30px,8vw,42px);font-weight:650;
  line-height:1;letter-spacing:-.02em;margin:6px 0 12px;color:var(--text)}
.kpis{display:flex;gap:20px;flex-wrap:wrap}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;margin-top:2px}
.chart{width:100%;height:96px;display:block}
.chart-empty{color:var(--muted);font-size:12.5px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:16px;text-align:center}
@media (min-width:640px){ .hero-grid{grid-template-columns:minmax(220px,1fr) minmax(260px,1.1fr);align-items:end} }

/* ---- filters ---- */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 12px;min-height:36px;
  border-radius:999px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--panel2);color:var(--text);border-color:#3a3e44}
.search{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;min-height:40px;min-width:160px}

/* ---- listes en cards ---- */
.list{display:flex;flex-direction:column;gap:8px}
.card-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel);text-align:left;width:100%}
.card-item:hover{border-color:#2e3238}
.card-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted)}
.card-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;font-size:15px;white-space:nowrap}
.card-sub-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.card-sub-row .r{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.tag{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;border:1px solid}
.t-scelle{color:var(--tag-scelle-fg);border-color:var(--tag-scelle-bd);background:var(--tag-scelle-bg)}
.t-loose{color:var(--tag-loose-fg);border-color:var(--tag-loose-bd);background:var(--tag-loose-bg)}
.t-gradee{color:var(--tag-gradee-fg);border-color:var(--tag-gradee-bd);background:var(--tag-gradee-bg)}
.dim{color:var(--muted)}
.pru-flag{font-size:10px;color:var(--muted);font-family:var(--mono)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:15px}

/* ---- boutons ---- */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 14px;
  min-height:44px;border-radius:var(--r-sm);font-size:13.5px}
.btn:hover{border-color:#3a3e44}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06120B;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--loss);color:var(--loss)}

/* ---- menu (sheet d'actions) ---- */
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-item{background:var(--panel2);border:1px solid var(--line);color:var(--text);text-align:left;
  padding:12px 14px;min-height:44px;border-radius:var(--r-sm);font-size:14px}
.menu-item:hover{border-color:#3a3e44}
.menu-item.danger{color:var(--loss)}

/* ---- modal / sheet ---- */
.backdrop{position:fixed;inset:0;background:rgba(6,7,9,.68);z-index:50;display:flex;justify-content:flex-end}
.backdrop.align-bottom{justify-content:center;align-items:flex-end}
.sheet{background:var(--panel);border-left:1px solid var(--line);width:min(560px,100%);height:100%;
  overflow-y:auto;padding:20px}
.sheet.center{margin:auto;border:1px solid var(--line);border-radius:var(--r);height:auto;
  max-height:92vh;width:min(520px,94%)}
.sheet.bottom{margin:0;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;
  height:90dvh;width:100%;max-width:560px}
.sheet h2{margin:2px 0 2px;font-size:18px;letter-spacing:-.01em}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}
label{display:block;margin-bottom:12px}
label .lb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px;min-height:44px}
textarea{min-height:auto}
input:hover,select:hover{border-color:#3a3e44}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}

/* ---- bloc estimation ---- */
.est{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;margin:16px 0}
.est-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.est-val{font-family:var(--mono);font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.conf{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid}
.c-haute{color:var(--accent);border-color:rgba(62,220,123,.35)}
.c-moyenne{color:var(--tag-scelle-fg);border-color:var(--tag-scelle-bd)}
.c-faible{color:var(--loss);border-color:rgba(255,107,94,.35)}
.axis{position:relative;height:64px;margin:2px 0 6px}
.axis .line{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--line)}
.dot{position:absolute;top:34px;transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);border:1px solid var(--ink)}
.dot.out{background:#3a3e44}
.marker{position:absolute;top:16px;bottom:8px;width:2px;background:var(--tag-scelle-fg);transform:translateX(-50%)}
.marker::after{content:"est.";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;
  color:var(--tag-scelle-fg);letter-spacing:.08em}
.axis .lbl{position:absolute;top:46px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.comp{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 0;
  border-top:1px solid var(--line);font-size:13px}
.comp .p{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.comp.excluded{opacity:.45}
.w{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);padding:4px 7px;border-radius:6px;min-width:32px;min-height:32px}
.x:hover{color:var(--loss);background:rgba(255,107,94,.1)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.warn{background:rgba(217,181,74,.1);border:1px solid var(--tag-scelle-bd);color:var(--tag-scelle-fg);
  padding:10px 12px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:14px 0 0}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--muted)}
.hist{width:100%;height:104px;display:block;margin:6px 0 2px}
.badge{font-size:10.5px;letter-spacing:.03em;padding:3px 8px;border-radius:5px;border:1px solid;white-space:nowrap}
.b-up{color:var(--accent);border-color:rgba(62,220,123,.35)}
.b-down{color:var(--loss);border-color:rgba(255,107,94,.35)}
.b-flat{color:var(--muted);border-color:var(--line)}

@media (max-width:640px){ .f3{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="appshell">

<header class="topbar">
  <div class="brand"><span class="dot"></span><span id="stamp-name">Portefeuille</span></div>
</header>

<div class="shell">
  <nav class="tabbar" aria-label="Navigation principale">
    <button class="fab" id="fab" aria-label="Ajouter un relevé de prix">
      <span aria-hidden="true">+</span><span class="fab-label">Ajouter un relevé</span>
    </button>
    <button data-mode="owned" aria-pressed="true"><span class="ico">◆</span><span>Portefeuille</span></button>
    <button data-mode="watch" aria-pressed="false"><span class="ico">◇</span><span>Veille <span id="watch-count"></span></span></button>
    <button data-mode="deals" aria-pressed="false"><span class="ico">⇄</span><span>Achat-revente</span></button>
    <button data-action="menu" aria-label="Menu"><span class="ico">⋯</span><span>Menu</span></button>
  </nav>

  <main class="content">
    <div id="storage-warn"></div>

    <section class="hero">
      <div class="hero-grid">
        <div>
          <span class="eyebrow">Valeur estimée du portefeuille</span>
          <div class="total num" id="total">—</div>
          <div class="kpis">
            <div class="kpi"><span class="eyebrow">Investi</span><div class="v num" id="invested">—</div></div>
            <div class="kpi"><span class="eyebrow">Plus-value</span><div class="v num" id="pnl">—</div></div>
            <div class="kpi"><span class="eyebrow">Net de frais</span><div class="v num" id="net">—</div></div>
            <div class="kpi"><span class="eyebrow">Items</span><div class="v num" id="count">—</div></div>
          </div>
        </div>
        <div>
          <span class="eyebrow">Progression</span>
          <div id="chart-host"></div>
        </div>
      </div>
    </section>

    <div class="filters" id="items-toolbar">
      <button class="btn primary" data-action="new-item">+ Nouvel item</button>
    </div>
    <div class="filters" id="filters-items">
      <button class="chip" data-filter="all" aria-pressed="true">Tout</button>
      <button class="chip" data-filter="scelle" aria-pressed="false">Scellé</button>
      <button class="chip" data-filter="loose" aria-pressed="false">Loose</button>
      <button class="chip" data-filter="gradee" aria-pressed="false">Gradée</button>
      <input class="search" id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher un item">
    </div>
    <div class="filters" id="deal-toolbar" style="display:none">
      <button class="btn primary" data-action="new-card-sheet">+ Fiche carte</button>
      <button class="btn primary" data-action="new-import-order">+ Import Japon</button>
      <button class="btn ghost" data-action="card-settings">Paramètres</button>
    </div>

    <div class="list" id="rows"></div>
  </main>
</div>

</div>

<input type="file" id="file" accept="application/json,.zip" hidden>
<div id="overlay"></div>

<script>
"use strict";

const TYPES = {scelle:"Scellé", loose:"Loose", gradee:"Gradée"};
const TYPE_EMOJI = {scelle:"📦", loose:"🃏", gradee:"🏆"};
let S = null, filter = "all", query = "", openItem = null, mode = "owned";
let cardDeals = null, openSheetId = null, openOrderId = null;
const BUY_PLATFORM_LABELS = {ebay:"eBay", vinted:"Vinted", cardmarket:"Cardmarket", japan:"Proxy Japon"};
const SELL_PLATFORM_LABELS = {ebay:"eBay", vinted:"Vinted", cardmarket:"Cardmarket"};

async function loadCardDeals(){
  cardDeals = await api("/api/card-deals");
}

/* ---------------- accès API ---------------- */
async function api(path, opts={}){
  const o = {headers:{}, credentials:"same-origin", ...opts};
  if(o.json){ o.method = o.method||"POST"; o.headers["Content-Type"]="application/json";
    o.body = JSON.stringify(o.json); delete o.json; }
  const r = await fetch(path, o);
  if(r.status===401){ location.reload(); throw new Error("401"); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.status===204 ? null : r.json();
}
async function refresh(){
  try{
    S = await api("/api/state");
    document.getElementById("storage-warn").innerHTML = "";
    render();
  }catch(e){
    if(e.message!=="401") document.getElementById("storage-warn").innerHTML =
      `<div class="warn">Serveur injoignable. Vérifie qu'il tourne et que l'appareil est sur le même réseau.</div>`;
  }
}

/* ---------------- formats ---------------- */
const eur = n => (n==null||isNaN(n)) ? "—" : new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:2}).format(n);
const pct = n => (n==null||isNaN(n)) ? "—" : (n>=0?"+":"") + n.toFixed(1).replace(".",",") + " %";
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"2-digit"});
const srcLabel = k => S?.sources?.[k]?.label || k;

/* ---------------- rendu ---------------- */
function render(){
  const t = S.totals;
  document.getElementById("total").textContent = eur(t.value);
  document.getElementById("invested").textContent = eur(t.invested);
  document.getElementById("count").textContent = t.units;
  const p = document.getElementById("pnl");
  p.textContent = eur(t.pnl) + (t.invested ? ` (${pct(t.pnl/t.invested*100)})` : "");
  p.className = "v num " + (t.pnl>=0?"gain":"loss");
  const n = document.getElementById("net");
  n.textContent = eur(t.net); n.className = "v num " + (t.net>=0?"gain":"loss");
  document.getElementById("chart-host").innerHTML = chartSVG();
  document.getElementById("stamp-name").textContent = "Portefeuille";
  renderRows();
}
function chartSVG(){
  const s = S.snapshots;
  if(s.length<2) return `<div class="chart-empty">Deux points suffisent pour tracer la courbe. Reviens demain, ou enregistre un point depuis le menu.</div>`;
  const W=520,H=96,P=6;
  const vals = s.flatMap(p=>[p.value,p.invested]);
  const lo = Math.min(...vals)*0.97, hi = Math.max(...vals)*1.03 || 1;
  const x = i => P + i*(W-2*P)/(s.length-1);
  const y = v => H-P - (v-lo)/((hi-lo)||1)*(H-2*P);
  const path = k => s.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(" ");
  const area = path("value") + ` L${x(s.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
  const diff = s[s.length-1].value - s[0].value;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du portefeuille">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3EDC7B" stop-opacity=".28"/><stop offset="100%" stop-color="#3EDC7B" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${path("invested")}" fill="none" stroke="#4A4E54" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="${path("value")}" fill="none" stroke="#3EDC7B" stroke-width="2"/>
    <circle cx="${x(s.length-1).toFixed(1)}" cy="${y(s[s.length-1].value).toFixed(1)}" r="3.5" fill="#6FE8A6"/>
  </svg>
  <div class="eyebrow" style="margin-top:6px">${s.length} points · depuis le ${fr(s[0].d)} : <span class="${diff>=0?'gain':'loss'}">${eur(diff)}</span> · tirets = investi</div>`;
}
function trendBadge(v, suffix="%"){
  if(v==null) return `<span class="badge b-flat">—</span>`;
  const c = v>2 ? "b-up" : v<-2 ? "b-down" : "b-flat";
  const arrow = v>2 ? "↑" : v<-2 ? "↓" : "→";
  return `<span class="badge ${c}">${arrow} ${(v>=0?"+":"")}${v.toFixed(1).replace(".",",")}${suffix}</span>`;
}
const sales = v => v==null ? "—" : v>=10 ? Math.round(v)+"/mois" : v.toFixed(1).replace(".",",")+"/mois";

function thumbOf(entity){
  const p = (entity.photos||[])[0];
  if(p) return `<img src="${p.thumb_url}" alt="">`;
  return TYPE_EMOJI[entity.type] || "📦";
}

function cardSheetBadge(){ return `<span class="tag t-gradee">🃏 Fiche carte</span>`; }
function importOrderBadge(){ return `<span class="tag t-scelle">📦 Import Japon</span>`; }

function renderCardDeals(){
  const host = document.getElementById("rows");
  if(!cardDeals){ host.innerHTML = `<div class="empty">Chargement…</div>`; return; }
  const sheets = cardDeals.card_sheets||[], orders = cardDeals.import_orders||[];
  if(!sheets.length && !orders.length){
    host.innerHTML = `<div class="empty"><b>Aucune fiche</b>
      Pars d'une carte et d'un objectif de bénéfice pour connaître ton prix d'achat max, ou décris une commande d'import Japon pour en calculer le coût réel.
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" data-action="new-card-sheet">+ Fiche carte</button>
        <button class="btn primary" data-action="new-import-order">+ Import Japon</button>
      </div></div>`;
    return;
  }
  const rows = [
    ...sheets.map(s=>({...s, _kind:"sheet"})),
    ...orders.map(o=>({...o, _kind:"order"})),
  ].sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""));

  host.innerHTML = rows.map(r=>{
    if(r._kind==="sheet"){
      const name = r.item_name || r.name || "Fiche sans nom";
      const prudent = r.computed.scenarios.prudent;
      const doneTag = r.status==="done" ? `<span class="tag" style="color:var(--accent);border-color:rgba(62,220,123,.35);margin-left:6px">Réalisée</span>`
        : r.status==="archived" ? `<span class="tag dim" style="margin-left:6px">Archivée</span>` : "";
      const nFail = (r.listings||[]).filter(l=>l.verdict===false).length;
      return `<button class="card-item" data-open-sheet="${r.id}">
        <div class="card-thumb">🃏</div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">${esc(name)}</span>
            <span class="card-value">${prudent?eur(prudent.c_max):"—"}</span></div>
          <div class="card-sub-row">
            <span>${cardSheetBadge()}${doneTag} · objectif ${r.computed.profit_target_pct}%</span>
            <span class="r">${r.listings.length?`${r.listings.length} annonce${r.listings.length>1?"s":""}${nFail?`, ${nFail} au-dessus`:""}`:"—"}</span>
          </div>
        </div>
      </button>`;
    }
    const c = r.computed;
    const statusLbl = {brouillon:"Brouillon", commandee:"Commandée", recue:"Reçue"}[r.status]||r.status;
    return `<button class="card-item" data-open-order="${r.id}">
      <div class="card-thumb">📦</div>
      <div class="card-body">
        <div class="card-title-row"><span class="card-title">${esc(r.name||"Commande sans nom")}</span>
          <span class="card-value ${c.profit_total_eur>=0?'gain':'loss'}">${eur(c.profit_total_eur)}</span></div>
        <div class="card-sub-row">
          <span>${importOrderBadge()} · ${statusLbl} · ${r.lines.length} carte${r.lines.length>1?"s":""}</span>
          <span class="r ${c.n_flagged?'loss':'dim'}">${c.margin_pct!=null?pct(c.margin_pct):"—"}${c.n_flagged?` · ${c.n_flagged} sous seuil`:""}</span>
        </div>
      </div>
    </button>`;
  }).join("");
}

function renderRows(){
  if(mode==="deals") return renderCardDeals();
  const host = document.getElementById("rows");
  const pool = S.items.filter(i => (i.status||"owned")===mode);
  document.getElementById("watch-count").textContent = S.totals.watching ? `(${S.totals.watching})` : "";

  const list = pool.filter(i =>
    (filter==="all" || i.type===filter) &&
    (!query || (i.name+" "+(i.set_name||"")+" "+(i.grade||"")).toLowerCase().includes(query))
  ).sort((a,b)=> mode==="owned" ? b.value-a.value
      : ((b.stats.sales_month??-1)-(a.stats.sales_month??-1)));

  if(!pool.length){
    host.innerHTML = mode==="owned"
      ? `<div class="empty"><b>Aucun item en portefeuille</b>
          Ajoute un display, une carte ou une gradée, puis colle tes relevés de prix.
          <div style="margin-top:14px"><button class="btn primary" data-action="new-item">+ Ajouter un item</button></div></div>`
      : `<div class="empty"><b>Rien sous surveillance</b>
          Mets ici ce que tu n'as pas encore acheté. Ajoute des relevés au fil des semaines : tu verras la tendance et le rythme des ventes avant de te décider.
          <div style="margin-top:14px"><button class="btn primary" data-action="new-item">+ Suivre un item</button></div></div>`;
    return;
  }
  if(!list.length){ host.innerHTML = `<div class="empty"><b>Rien ne correspond</b>Change le filtre ou la recherche.</div>`; return; }

  if(mode==="watch"){
    host.innerHTML = list.map(i=>{
      const st = i.stats;
      return `<button class="card-item" data-open="${i.id}">
        <div class="card-thumb">${thumbOf(i)}</div>
        <div class="card-body">
          <div class="card-title-row">
            <span class="card-title">${esc(i.name)}</span>
            <span class="card-value">${eur(i.est.value)}</span>
          </div>
          <div class="card-sub-row">
            <span><span class="tag t-${i.type}">${TYPES[i.type]}</span>
              ${[i.set_name,i.grade].filter(Boolean).map(esc).join(" · ")}</span>
            <span class="r">${trendBadge(st.trend30)} ${sales(st.sales_month)}</span>
          </div>
        </div>
      </button>`;
    }).join("");
    return;
  }

  host.innerHTML = list.map(i=>{
    const d = i.cost ? (i.value-i.cost)/i.cost*100 : null;
    return `<button class="card-item" data-open="${i.id}">
      <div class="card-thumb">${thumbOf(i)}</div>
      <div class="card-body">
        <div class="card-title-row">
          <span class="card-title">${esc(i.name)}</span>
          <span class="card-value">${eur(i.value)}</span>
        </div>
        <div class="card-sub-row">
          <span><span class="tag t-${i.type}">${TYPES[i.type]}</span>
            ${i.qty>1?`× ${i.qty} · `:""}${[i.set_name,i.lang].filter(Boolean).map(esc).join(" · ")}</span>
          <span class="r ${d==null?"dim":d>=0?"gain":"loss"}">${pct(d)}</span>
        </div>
      </div>
    </button>`;
  }).join("");
}

/* ---------------- panneaux ---------------- */
function historyChart(item){
  const pts = item.est.points.filter(p=>p.price>0);
  if(pts.length<2) return "";
  const W=480,H=104,PL=4,PT=10,PB=16;
  const maxAge = Math.max(...pts.map(p=>daysAgo(p.date)), 1);
  const vals = pts.map(p=>p.price).concat(item.target_price?[item.target_price]:[]);
  const lo = Math.min(...vals)*0.96, hi = Math.max(...vals)*1.04 || 1;
  const x = age => W-PL - (age/maxAge)*(W-2*PL);
  const y = v => H-PB - (v-lo)/((hi-lo)||1)*(H-PT-PB);
  const fit = item.stats.fit;
  const trend = fit ? `<line x1="${x(maxAge).toFixed(1)}" y1="${y(fit.now + fit.slope*(-maxAge)).toFixed(1)}"
      x2="${x(0).toFixed(1)}" y2="${y(fit.now).toFixed(1)}" stroke="#6E93D6" stroke-width="1.5" opacity=".8"/>` : "";
  const target = item.target_price ? `<line x1="0" y1="${y(item.target_price).toFixed(1)}" x2="${W}" y2="${y(item.target_price).toFixed(1)}"
      stroke="#D9B54A" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>` : "";
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Historique des relevés de prix">
    ${target}${trend}
    ${pts.map(p=>`<circle cx="${x(daysAgo(p.date)).toFixed(1)}" cy="${y(p.price).toFixed(1)}" r="${3+Math.min(3,((p.sold_count||1)-1)*0.6)}"
      fill="${p.out||p.excluded?"#3a3e44":"#3EDC7B"}"/>`).join("")}
  </svg>
  <div class="eyebrow" style="display:flex;justify-content:space-between">
    <span>il y a ${Math.round(maxAge)} j</span>${item.target_price?'<span style="color:var(--tag-scelle-fg)">— — objectif</span>':""}<span>aujourd'hui</span></div>`;
}
const daysAgo = d => Math.max(0,(Date.now()-new Date(d+"T12:00:00").getTime())/864e5);

function statsBlock(item){
  const st = item.stats;
  const cell = (lb, val, sub) => `<div class="stat"><span class="eyebrow">${lb}</span><div class="v">${val}</div>
    ${sub?`<div class="s">${sub}</div>`:""}</div>`;
  return `<div class="stats">
    ${cell("Tendance 30j", trendBadge(st.trend30), st.trend30==null?"pas assez de recul":"vs les 60 j précédents")}
    ${cell("Rythme", trendBadge(st.slope_pct), st.slope_pct==null?"série trop courte":"pente sur 180 j")}
    ${cell("Ça part ?", sales(st.sales_month), st.sales_90?`${st.sales_90} ventes relevées sur 90 j`:"aucune vente relevée")}
    ${cell("Dispersion", st.spread==null?"—":Math.round(st.spread)+" %", st.low90!=null?`${eur(st.low90)} → ${eur(st.high90)}`:"")}
  </div>`;
}

function openSheet(html, cls){
  const backdropCls = cls==="bottom" ? "backdrop align-bottom" : "backdrop";
  const sheetCls = cls==="bottom" ? "bottom" : (cls||"");
  document.getElementById("overlay").innerHTML =
    `<div class="${backdropCls}" data-close><div class="sheet ${sheetCls}">${html}</div></div>`;
  const f = document.querySelector(".sheet input, .sheet select, .sheet button");
  if(f) f.focus();
}
function closeSheet(){ document.getElementById("overlay").innerHTML=""; openItem=null; }

function purchasesBlock(item){
  if((item.status||"owned")==="watch") return ""; // la veille n'a pas de prix d'achat à répartir
  const lots = item.purchases || [];
  const totalQty = lots.reduce((s,l)=>s+l.qty,0);
  const totalCost = lots.reduce((s,l)=>s+l.price*l.qty,0);
  const rows = [...lots].sort((a,b)=>a.date<b.date?1:-1).map(l=>`
    <div class="comp">
      <span class="p">${eur(l.price)}<span class="dim" style="font-weight:400;font-size:11px"> × ${l.qty}</span></span>
      <span>${fr(l.date)}${l.note?` <span class="dim">· ${esc(l.note)}</span>`:""}</span>
      <span class="w">${eur(l.price*l.qty)}</span>
      <span><button class="x" data-del-purchase="${l.id}" title="Supprimer">✕</button></span>
    </div>`).join("") ||
    `<p class="note">Aucun détail : le prix d'achat unique du formulaire est utilisé (${eur(item.buy_price)} × ${item.qty}). Ajoute des prix différents ici si tu as payé certaines unités plus cher que d'autres (même item, même fiche).</p>`;
  return `
    <hr class="sep">
    <span class="eyebrow">Prix d'achat détaillés${lots.length?` · ${totalQty} unité${totalQty>1?"s":""} · PRU moyen ${eur(totalCost/totalQty)}`:""}</span>
    <div style="margin:8px 0 14px">${rows}</div>
    <div class="f3">
      <label><span class="lb">Prix payé</span><input id="p-price" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></label>
      <label><span class="lb">Quantité</span><input id="p-qty" type="number" inputmode="numeric" min="1" step="1" value="1"></label>
      <label><span class="lb">Date</span><input id="p-date" type="date" value="${today()}"></label>
    </div>
    <div class="f2">
      <label><span class="lb">Note</span><input id="p-note" placeholder="facultatif (vendeur, lot…)"></label>
      <div style="display:flex;align-items:flex-end;padding-bottom:12px">
        <button class="btn" data-add-purchase="${item.id}" style="width:100%">Ajouter ce prix d'achat</button>
      </div>
    </div>`;
}

function itemSheet(id){
  const i = S.items.find(x=>x.id===id); if(!i) return;
  openItem = id;
  const e = i.est, d = i.cost ? (i.value-i.cost)/i.cost*100 : null;
  const watch = (i.status||"owned")==="watch";
  const pts = e.points;
  const ps = pts.map(x=>x.price);
  const lo = Math.min(...ps, e.value ?? Infinity), hi = Math.max(...ps, e.value ?? 0);
  const posOf = p => hi>lo ? ((p-lo)/(hi-lo))*94+3 : 50;
  const maxW = Math.max(...pts.map(x=>x.weight||0), 0.001);

  const axis = pts.length ? `
    <div class="axis"><div class="line"></div>
      ${pts.map(x=>{const r=6+10*((x.weight||0)/maxW);
        return `<div class="dot ${x.out||x.excluded?"out":""}" style="left:${posOf(x.price)}%;width:${r}px;height:${r}px" title="${eur(x.price)}"></div>`}).join("")}
      ${e.value!=null&&!e.fallback?`<div class="marker" style="left:${posOf(e.value)}%"></div>`:""}
      <div class="lbl" style="left:0">${eur(lo)}</div><div class="lbl" style="right:0">${eur(hi)}</div>
    </div>` : `<p class="note">Aucun relevé pour l'instant : la valeur affichée est ton prix d'achat.</p>`;

  const comps = [...pts].sort((a,b)=>a.date<b.date?1:-1).map(c=>`
    <div class="comp ${c.excluded||c.out?"excluded":""}">
      <span class="p">${eur(c.price)}${c.shipping>0?`<span class="dim" style="font-weight:400;font-size:11px"> +${eur(c.shipping)} port</span>`:""}</span>
      <span>${esc(srcLabel(c.source))} <span class="dim">· ${fr(c.date)}</span>${c.shipping>0?` <span class="dim">· total ${eur(c.total)}</span>`:""}${c.note?` <span class="dim">· ${esc(c.note)}</span>`:""}${c.out?' <span class="dim">· écarté (aberrant)</span>':""}</span>
      <span class="w">${c.excluded?"ignoré":"poids "+(c.weight||0).toFixed(2)}</span>
      <span><button class="x" data-toggle-comp="${c.id}" title="Ignorer / réintégrer">${c.excluded?"↺":"⦸"}</button><button class="x" data-del-comp="${c.id}" title="Supprimer">✕</button></span>
    </div>`).join("") || `<p class="note">Ajoute une vente eBay conclue, un prix tendance Cardmarket, une vente d'un groupe… chaque ligne pèse selon sa source et sa fraîcheur.</p>`;

  const photosBlock = `
    <div style="margin:12px 0 16px">
      <span class="eyebrow">Photos (${(i.photos||[]).length}/8)</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center">
        ${(i.photos||[]).map((p,idx)=>`
          <div style="position:relative;width:72px;height:72px">
            <a href="${p.url}" target="_blank" style="display:block;width:100%;height:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line)">
              <img src="${p.thumb_url}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
            </a>
            <button class="x" data-del-photo="${p.id}" title="Supprimer" style="position:absolute;top:-6px;right:-6px;background:var(--panel);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;padding:0;line-height:22px;min-width:0;min-height:0">✕</button>
            ${idx>0?`<button class="x" data-photo-up="${p.id}" title="Vers le début" style="position:absolute;bottom:-6px;left:-6px;background:var(--panel);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;padding:0;line-height:22px;min-width:0;min-height:0">←</button>`:''}
          </div>`).join("")}
        ${(i.photos||[]).length < 8 ? `
          <label style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;cursor:pointer;color:var(--muted);font-size:22px;margin:0" title="Ajouter des photos">
            +
            <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple data-item="${i.id}" hidden>
          </label>` : ''}
      </div>
      <p class="note" style="margin-top:6px">JPEG/PNG/WebP/HEIC · 10 Mo max · redimensionné auto en WebP.</p>
    </div>`;
  openSheet(`
    <div class="sheet-head">
      <div><span class="eyebrow">${watch?"En veille · ":""}${TYPES[i.type]}${i.grade?" · "+esc(i.grade):""}</span><h2>${esc(i.name)}</h2>
        <span class="dim" style="font-size:13px">${[i.set_name,i.lang].filter(Boolean).map(esc).join(" · ")}</span></div>
      <button class="btn ghost" data-close-btn>Fermer</button>
    </div>
    ${photosBlock}
    <div class="est">
      <div class="est-top">
        <div><span class="eyebrow">Prix de vente moyen estimé</span>
          <div class="est-val">${eur(e.value)}${e.fallback?' <span class="pru-flag">= prix d\'achat</span>':""}</div></div>
        <span class="conf c-${e.conf}">Fiabilité ${e.conf}</span>
      </div>
      ${axis}
      <div class="eyebrow" style="margin-top:10px">Comment on arrive à ce prix</div>
      <p class="note">Moyenne pondérée de ${e.n} relevé${e.n>1?"s":""} : chaque prix compte selon sa source et perd la moitié de son poids tous les ${S.settings.halfLife} jours. Les valeurs aberrantes sont écartées automatiquement.</p>
    </div>
    ${historyChart(i)}
    ${statsBlock(i)}
    <hr class="sep">
    ${watch ? `<div class="f3">
      <div><span class="eyebrow">Objectif d'achat</span><div class="num" style="font-size:17px">${i.target_price?eur(i.target_price):"—"}</div></div>
      <div><span class="eyebrow">Écart au marché</span><div class="num ${i.gap!=null&&i.gap<=0?"gain":"dim"}" style="font-size:17px">${i.gap!=null?pct(i.gap):"—"}</div></div>
      <div><span class="eyebrow">Historique</span><div class="num" style="font-size:17px">${i.stats.span} j</div></div>
    </div>` : `<div class="f3">
      <div><span class="eyebrow">Quantité</span><div class="num" style="font-size:17px">${i.qty}</div></div>
      <div><span class="eyebrow">Investi</span><div class="num" style="font-size:17px">${eur(i.cost)}</div></div>
      <div><span class="eyebrow">Plus-value</span><div class="num ${d>=0?"gain":"loss"}" style="font-size:17px">${eur(i.value-i.cost)} · ${pct(d)}</div></div>
    </div>`}
    ${purchasesBlock(i)}
    ${i.notes?`<p class="note">${esc(i.notes)}</p>`:""}
    <hr class="sep">
    <span class="eyebrow">Relevés de prix (${pts.length})</span>
    <div style="margin:8px 0 14px">${comps}</div>
    <div class="f3">
      <label><span class="lb">Prix article</span><input id="c-price" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></label>
      <label><span class="lb">Port</span><input id="c-ship" type="number" inputmode="decimal" step="0.01" min="0" value="0" placeholder="0,00"></label>
      <label><span class="lb">Date</span><input id="c-date" type="date" value="${today()}"></label>
    </div>
    <div class="f3">
      <label><span class="lb">Source</span><select id="c-source">${Object.entries(S.sources).map(([k,s])=>`<option value="${k}">${esc(s.label)}</option>`).join("")}</select></label>
      <label><span class="lb">Nb de ventes</span><input id="c-count" type="number" inputmode="numeric" min="1" step="1" value="1"></label>
      <label><span class="lb">Note</span><input id="c-note" placeholder="facultatif"></label>
    </div>
    <p class="note">Un relevé peut résumer plusieurs ventes : « 9 ventes eBay autour de 104 € cette semaine » → prix 104, nb de ventes 9. C'est ce qui alimente le rythme de vente.</p>
    <div class="actions">
      <button class="btn danger ghost" data-del-item="${i.id}">Supprimer</button>
      <button class="btn" data-edit-item="${i.id}">Modifier</button>
      ${watch ? `<button class="btn" data-buy="${i.id}">Je l'ai acheté</button>`
              : `<button class="btn ghost" data-unbuy="${i.id}">Remettre en veille</button>`}
      <button class="btn primary" data-add-comp="${i.id}">Ajouter le relevé</button>
    </div>`);
}

function cardSheetRow(row){

function scenarioBlock(sc, title){
  if(!sc) return `<p class="note">${title} : fourchette de revente manquante, calcul impossible.</p>`;
  return `<div style="margin:10px 0 6px">
    <div class="est-top" style="margin-bottom:8px">
      <span class="eyebrow">${title} — revente visée ${eur(sc.resale_price)}</span>
      <span class="num" style="font-weight:650">${eur(sc.c_max)}</span>
    </div>
    ${sc.rows.map(cardSheetRow).join("")}
    <details style="margin-top:8px">
      <summary class="eyebrow" style="cursor:pointer">Détail du calcul</summary>
      <div style="margin-top:8px;font-size:13px">
        <div class="comp" style="grid-template-columns:1fr auto"><span>Prix de revente</span><span class="p">${eur(sc.resale_price)}</span></div>
        <div class="comp" style="grid-template-columns:1fr auto"><span>− Commission plateforme de revente</span><span class="p">${eur(sc.net.commission)}</span></div>
        <div class="comp" style="grid-template-columns:1fr auto"><span>− Mon envoi + emballage</span><span class="p">${eur(sc.net.my_shipping_cost)}</span></div>
        <div class="comp" style="grid-template-columns:1fr auto"><span><b>= Net encaissé</b></span><span class="p"><b>${eur(sc.net.net)}</b></span></div>
        <div class="comp" style="grid-template-columns:1fr auto"><span><b>÷ (1 + objectif de bénéfice)</b></span><span class="p"></span></div>
        <div class="comp" style="grid-template-columns:1fr auto"><span><b>= Coût de revient max</b></span><span class="p"><b>${eur(sc.c_max)}</b></span></div>
      </div>
    </details>
  </div>`;
}

function cardSheetListingsBlock(sheet){

  const rows = listings.map(l=>`
    <div class="comp" style="grid-template-columns:auto 1fr auto auto">
      <span class="p">${eur(l.price)}${l.shipping?`<span class="dim" style="font-weight:400;font-size:11px"> +${eur(l.shipping)} port</span>`:""}</span>
      <span>${esc(BUY_PLATFORM_LABELS[l.platform]||l.platform)}${l.url?` · <a href="${esc(l.url)}" target="_blank" style="color:var(--muted)">lien</a>`:""}</span>
      <span class="${l.verdict===false?'loss':l.verdict===true?'gain':'dim'}" style="font-size:12px">${l.verdict==null?"—":l.verdict?`OK · ${eur(l.gap)}`:`échec · ${eur(l.gap)}`}</span>
      <span><button class="x" data-del-listing="${l.id}" data-sheet="${sheet.id}" title="Supprimer">✕</button></span>

    <div style="margin:8px 0 14px">${rows}</div>
    <div class="f3">
      <label><span class="lb">Plateforme</span><select id="l-platform">

      <label><span class="lb">Port</span><input id="l-shipping" type="number" step="0.01" min="0" value="0"></label>

function lineAmountLabel(l){

    return `${eur(l.unit_price_eur)} <span class="dim" style="font-size:10px">(saisie €)</span>`;

  if(!l.unit_price_eur && l.unit_price_jpy){
    return `${jpyTxt} <span class="dim" style="font-size:10px">(saisie ¥ · taux indisponible)</span>`;

  return `${jpyTxt}<span class="dim" style="font-size:10px"> (saisie ¥)</span>${l.unit_price_eur?` ≈ ${eur(l.unit_price_eur)}`:""}`;
}

      ${editable ? `<button class="btn primary" data-save-order="${o?.id||""}">Enregistrer</button>` : ""}

/* ---------------- actions ---------------- */
document.addEventListener("click", async ev=>{
  const t = ev.target;
  try{
    const act = t.closest("[data-action]")?.dataset.action;
    if(act==="menu") return menuSheet();
    if(act==="new-item") return itemForm(null);
    if(act==="settings") return settingsForm();
    if(act==="snapshot"){ closeSheet(); await api("/api/snapshot",{method:"POST"}); return refresh(); }
    if(act==="export"){
      const data = await api("/api/export");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
      a.download = `portefeuille-pokemon-${today()}.json`; a.click(); URL.revokeObjectURL(a.href); return;
    }
    if(act==="export-zip"){
      const r = await fetch("/api/export.zip", {credentials:"same-origin"});
      if(!r.ok) throw new Error("export impossible");
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `portefeuille-pokemon-${today()}.zip`; a.click(); URL.revokeObjectURL(a.href); return;
    }
    if(act==="import"){ closeSheet(); return document.getElementById("file").click(); }

    if(act==="logout"){ await api("/api/logout",{method:"POST"}); return location.reload(); }
    if(t.closest("[data-close-btn]") || t.hasAttribute("data-close")) return closeSheet();

    const open = t.closest("[data-open]");
    if(open) return itemSheet(open.dataset.open);

    const si = t.closest("[data-save-item]");
    if(si){
      const g = x => document.getElementById(x).value.trim();
      if(!g("f-name")) return document.getElementById("f-name").focus();
      const body = {name:g("f-name"), type:g("f-type"), lang:g("f-lang"), grade:g("f-grade"),
        set_name:g("f-set"), qty:g("f-qty"), buy_price:g("f-buy"), buy_date:g("f-date"), notes:g("f-notes"),
        status:g("f-status"), target_price:g("f-target")};
      const id = si.dataset.saveItem;
      await api(id==="new" ? "/api/items" : "/api/items/"+id, {json:body, method: id==="new"?"POST":"PUT"});
      closeSheet(); return refresh();
    }
    const ed = t.closest("[data-edit-item]"); if(ed) return itemForm(ed.dataset.editItem);

    const bu = t.closest("[data-buy]"); if(bu) return buyForm(bu.dataset.buy);
    const sb = t.closest("[data-save-buy]");
    if(sb){
      await api(`/api/items/${sb.dataset.saveBuy}/buy`, {json:{buy_price:document.getElementById("b-price").value,
        qty:document.getElementById("b-qty").value, buy_date:document.getElementById("b-date").value}});
      closeSheet(); mode = "owned";
      document.querySelectorAll("[data-mode]").forEach(c=>c.setAttribute("aria-pressed", c.dataset.mode==="owned"));
      return refresh();
    }
    const ub = t.closest("[data-unbuy]");
    if(ub){ await api(`/api/items/${ub.dataset.unbuy}/watch`,{method:"POST"}); closeSheet(); return refresh(); }

    const di = t.closest("[data-del-item]");
    if(di){
      if(!confirm("Supprimer cet item et ses relevés ?")) return;
      await api("/api/items/"+di.dataset.delItem,{method:"DELETE"}); closeSheet(); return refresh();
    }
    const ac = t.closest("[data-add-comp]");
    if(ac){
      const price = document.getElementById("c-price").value;
      if(!(parseFloat(price)>0)) return document.getElementById("c-price").focus();
      await api(`/api/items/${ac.dataset.addComp}/comps`, {json:{price,
        shipping:document.getElementById("c-ship").value || 0,
        date:document.getElementById("c-date").value,
        source:document.getElementById("c-source").value, note:document.getElementById("c-note").value.trim(),
        sold_count:document.getElementById("c-count").value}});
      await refresh(); return itemSheet(ac.dataset.addComp);
    }
    const tg = t.closest("[data-toggle-comp]");
    if(tg){ await api("/api/comps/"+tg.dataset.toggleComp,{method:"PATCH"}); const k=openItem; await refresh(); return itemSheet(k); }

    const dc = t.closest("[data-del-comp]");
    if(dc){ await api("/api/comps/"+dc.dataset.delComp,{method:"DELETE"}); const k=openItem; await refresh(); return itemSheet(k); }

    // --- Prix d'achat détaillés ---
    const addp = t.closest("[data-add-purchase]");
    if(addp){
      const price = document.getElementById("p-price").value;
      if(!(parseFloat(price)>0)) return document.getElementById("p-price").focus();
      await api(`/api/items/${addp.dataset.addPurchase}/purchases`, {json:{price,
        qty:document.getElementById("p-qty").value,
        date:document.getElementById("p-date").value,
        note:document.getElementById("p-note").value.trim()}});
      await refresh(); return itemSheet(addp.dataset.addPurchase);
    }
    const delp = t.closest("[data-del-purchase]");
    if(delp){
      await api("/api/purchases/"+delp.dataset.delPurchase,{method:"DELETE"});
      const k=openItem; await refresh(); return itemSheet(k);
    }

    // --- Photos ---
    const dp = t.closest("[data-del-photo]");
    if(dp){
      if(!confirm("Supprimer cette photo ?")) return;
      await api(`/api/items/${openItem}/photos/${dp.dataset.delPhoto}`,{method:"DELETE"});
      await refresh(); return itemSheet(openItem);
    }
    const up = t.closest("[data-photo-up]");
    if(up){
      const item = S.items.find(x=>x.id===openItem); if(!item) return;
      const ids = (item.photos||[]).map(p=>p.id);
      const i0 = ids.indexOf(up.dataset.photoUp);
      if(i0>0){ ids.splice(i0,1); ids.unshift(up.dataset.photoUp); }
      await api(`/api/items/${openItem}/photos/order`,{method:"PUT", json:{order:ids}});
      await refresh(); return itemSheet(openItem);
    }

    if(t.closest("[data-save-settings]")){
      const weights = {};
      document.querySelectorAll("[data-w]").forEach(el=> weights[el.dataset.w] = el.value);
      await api("/api/settings",{method:"PUT", json:{halfLife:document.getElementById("s-hl").value,
        fees:document.getElementById("s-fee").value, trimK:document.getElementById("s-k").value, weights}});
      closeSheet(); return refresh();
    }

    // --- Achat-revente : fiches carte ---
    if(act==="new-card-sheet") return cardSheetSheet(null);
    if(act==="new-import-order") return importOrderSheet(null);
    if(act==="card-settings") return cardSettingsForm();

    const os = t.closest("[data-open-sheet]"); if(os) return cardSheetSheet(os.dataset.openSheet);
    const oo = t.closest("[data-open-order]"); if(oo) return importOrderSheet(oo.dataset.openOrder);

    const ss = t.closest("[data-save-sheet]");
    if(ss){
      const g = x => document.getElementById(x).value.trim();
      const body = {
        item_id: g("cs-item")||null, name:g("cs-name"), type:g("cs-type"), grade:g("cs-grade"),
        lang:g("cs-lang"), set_name:g("cs-set"),
        profit_target_pct: g("cs-target")||null, resale_platform:g("cs-resale-platform"),
        resale_mode: g("cs-mode"), resale_min:g("cs-min")||null, resale_median:g("cs-median")||null, resale_max:g("cs-max")||null,
        resale_shipping_cost:g("cs-ship")||0, packaging_cost:g("cs-pack")||0, notes:g("cs-notes"),
      };
      if(!body.item_id && !body.name) return document.getElementById("cs-name").focus();
      const id = ss.dataset.saveSheet;
      const saved = id ? await api("/api/card-sheets/"+id,{json:body,method:"PUT"}) : await api("/api/card-sheets",{json:body,method:"POST"});
      await loadCardDeals(); return cardSheetSheet(id||saved.id);
    }
    const ds = t.closest("[data-del-sheet]");
    if(ds){
      if(!confirm("Supprimer cette fiche ?")) return;
      await api("/api/card-sheets/"+ds.dataset.delSheet,{method:"DELETE"});
      await loadCardDeals(); closeSheet(); return renderRows();
    }
    const asf = t.closest("[data-archive-sheet]");
    if(asf){
      await api(`/api/card-sheets/${asf.dataset.archiveSheet}/archive`,{method:"POST"});
      await loadCardDeals(); closeSheet(); return renderRows();
    }
    const rsf = t.closest("[data-realize-sheet]"); if(rsf) return cardSheetRealizeForm(rsf.dataset.realizeSheet);
    const srs = t.closest("[data-save-realize-sheet]");
    if(srs){
      await api(`/api/card-sheets/${srs.dataset.saveRealizeSheet}/realize`,{method:"POST",json:{
        buy_price:document.getElementById("csr-price").value, qty:document.getElementById("csr-qty").value,
        buy_date:document.getElementById("csr-date").value}});
      await Promise.all([loadCardDeals(), refresh()]); closeSheet(); return renderRows();
    }
    const al = t.closest("[data-add-listing]");
    if(al){
      const price = document.getElementById("l-price").value;
      if(!(parseFloat(price)>0)) return document.getElementById("l-price").focus();
      await api(`/api/card-sheets/${al.dataset.addListing}/listings`,{json:{
        platform:document.getElementById("l-platform").value, price,
        shipping:document.getElementById("l-shipping").value||0, url:document.getElementById("l-url").value.trim()}});
      await loadCardDeals(); return cardSheetSheet(al.dataset.addListing);
    }
    const dl = t.closest("[data-del-listing]");
    if(dl){
      await api(`/api/card-sheets/${dl.dataset.sheet}/listings/${dl.dataset.delListing}`,{method:"DELETE"});
      await loadCardDeals(); return cardSheetSheet(dl.dataset.sheet);
    }

    // --- Achat-revente : commandes d'import Japon ---
    const so = t.closest("[data-save-order]");
    if(so){
      const g = x => document.getElementById(x).value.trim();
      const gc = x => document.getElementById(x).checked;
      const body = {
        name:g("io-name"), supplier:g("io-supplier"), order_date:g("io-date"), split_mode:g("io-split"),
        fx_spread_pct:g("io-fxspread")||null, ioss_enabled:gc("io-ioss"),
        fee_proxy_pct:g("io-fee-proxy")||0, fee_proxy_fixed_jpy:g("io-fee-proxy-fixed")||0,
        n_orders:g("io-n-orders")||1, fee_domestic_jpy:g("io-fee-domestic")||0,
        fee_consolidation_jpy:g("io-fee-consolidation")||0, fee_intl_shipping_jpy:g("io-fee-intl")||0,
        fee_payment_pct:g("io-fee-payment")||0, low_margin_alert_pct:g("io-lowmargin")||null,
        vat_rate_pct:g("io-vat")||null, duty_rate_pct:g("io-duty")||null, carrier_fee_eur:g("io-carrier")||null,
        notes:g("io-notes"),
      };
      const id = so.dataset.saveOrder;
      const saved = id ? await api("/api/import-orders/"+id,{json:body,method:"PUT"}) : await api("/api/import-orders",{json:body,method:"POST"});
      await loadCardDeals(); return importOrderSheet(id||saved.id);
    }
    const doo = t.closest("[data-del-order]");
    if(doo){
      if(!confirm("Supprimer cette commande et ses lignes ?")) return;
      await api("/api/import-orders/"+doo.dataset.delOrder,{method:"DELETE"});
      await loadCardDeals(); closeSheet(); return renderRows();
    }
    const rfx = t.closest("[data-refresh-fx]");
    if(rfx && rfx.dataset.refreshFx){
      await api(`/api/import-orders/${rfx.dataset.refreshFx}/refresh-fx`,{method:"POST"});
      await loadCardDeals(); return importOrderSheet(rfx.dataset.refreshFx);
    }
    const sst = t.closest("[data-set-status]");
    if(sst){
      await api(`/api/import-orders/${sst.dataset.order}/status`,{method:"POST",json:{status:sst.dataset.setStatus}});
      await loadCardDeals(); return importOrderSheet(sst.dataset.order);
    }
    const rco = t.closest("[data-receive-order]");
    if(rco){
      await api(`/api/import-orders/${rco.dataset.receiveOrder}/receive`,{method:"POST",json:{
        received_duty_eur:document.getElementById("rc-duty").value||0,
        received_vat_eur:document.getElementById("rc-vat").value||0,
        received_carrier_fee_eur:document.getElementById("rc-carrier").value||0}});
      await Promise.all([loadCardDeals(), refresh()]); return importOrderSheet(rco.dataset.receiveOrder);
    }
    const addl = t.closest("[data-add-line]");
    if(addl){
      const name = document.getElementById("ol-name").value.trim();
      const price = document.getElementById("ol-price").value;
      const currency = document.getElementById("ol-currency").value;
      if(!name) return document.getElementById("ol-name").focus();
      if(!(parseFloat(price)>=0)) return document.getElementById("ol-price").focus();
      const body = {name, qty:document.getElementById("ol-qty").value||1, unit_currency:currency};
      if(currency==="EUR") body.unit_price_eur = price; else body.unit_price_jpy = price;
      await api(`/api/import-orders/${addl.dataset.addLine}/lines`,{json:body});
      await loadCardDeals(); return importOrderSheet(addl.dataset.addLine);
    }
    const tgl = t.closest("[data-toggle-line]");
    if(tgl){
      const el=document.getElementById("line-edit-"+tgl.dataset.toggleLine);
      if(el) el.style.display = el.style.display==="none" ? "block" : "none";
      return;
    }
    const svld = t.closest("[data-save-line-detail]");
    if(svld){
      const lid = svld.dataset.saveLineDetail, oid = svld.dataset.order;
      const order = cardDeals.import_orders.find(x=>x.id===oid);
      const line = order?.lines.find(l=>l.id===lid);
      if(!line) return;
      const currency = document.getElementById("ole-currency-"+lid).value;
      const amount = document.getElementById("ole-amount-"+lid).value;
      const body = {
        name:line.name, type:line.type, qty:line.qty, unit_currency:currency,
        resale_target_eur:document.getElementById("ole-resale-"+lid).value||null,
        resale_platform:document.getElementById("ole-platform-"+lid).value||null,
      };
      if(currency==="EUR"){ body.unit_price_eur = amount; body.unit_price_jpy = 0; }
      else { body.unit_price_jpy = amount; body.unit_price_eur = null; }
      await api(`/api/import-order-lines/${lid}`,{method:"PUT",json:body});
      await loadCardDeals(); return importOrderSheet(oid);
    }
    const sdeb = t.closest("[data-save-debit]");
    if(sdeb){
      await api(`/api/import-orders/${sdeb.dataset.saveDebit}/debit`,{method:"PUT",json:{
        received_debit_eur:document.getElementById("io-debit").value||null}});
      await loadCardDeals(); return importOrderSheet(sdeb.dataset.saveDebit);
    }
    const delln = t.closest("[data-del-line]");
    if(delln){
      const oid = openOrderId;
      await api("/api/import-order-lines/"+delln.dataset.delLine,{method:"DELETE"});
      await loadCardDeals(); return importOrderSheet(oid);
    }
    const rlz = t.closest("[data-realize-line]");
    if(rlz){
      if(!confirm("Basculer cette carte au portefeuille avec son coût de revient calculé comme prix d'achat ?")) return;
      await api(`/api/import-order-lines/${rlz.dataset.realizeLine}/realize`,{method:"POST",json:{}});
      await Promise.all([loadCardDeals(), refresh()]); return importOrderSheet(openOrderId);
    }
    const scs = t.closest("[data-save-card-settings]");
    if(scs){
      const g = id => document.getElementById(id).value;
      const sell_fees = {};
      document.querySelectorAll("[data-sf-pct]").forEach(el=>{ sell_fees[el.dataset.sfPct] = {...(sell_fees[el.dataset.sfPct]||{}), pct: el.value}; });
      document.querySelectorAll("[data-sf-fixed]").forEach(el=>{ sell_fees[el.dataset.sfFixed] = {...(sell_fees[el.dataset.sfFixed]||{}), fixed: el.value}; });
      const buy_fees = {vinted:{protection_pct:g("cds-vinted-pct"), protection_fixed:g("cds-vinted-fixed")}};
      document.querySelectorAll("[data-bf-ship]").forEach(el=>{ buy_fees[el.dataset.bfShip] = {...(buy_fees[el.dataset.bfShip]||{}), default_shipping: el.value}; });
      await api("/api/card-settings",{method:"PUT", json:{
        profit_target_pct:g("cds-target"), low_margin_alert_pct:g("cds-lowmargin"), japan_lot_size:g("cds-lotsize"),
        fx_spread_pct:g("cds-fxspread"),
        import: {vat_rate:g("cds-vat"), duty_rate:g("cds-duty"), carrier_fee:g("cds-carrier"), ioss_threshold:g("cds-ioss")},
        sell_fees, buy_fees,
      }});
      await loadCardDeals(); closeSheet(); return renderRows();
    }

    // --- saisie rapide ---
    if(t.id==="fab" || t.closest("#fab")) return quickAddPicker();
    const qi = t.closest("[data-quick-item]"); if(qi) return quickAddForm(qi.dataset.quickItem);
    const qs = t.closest("[data-quick-save]");
    if(qs){
      const price = document.getElementById("qc-price").value;
      if(!(parseFloat(price)>0)) return document.getElementById("qc-price").focus();
      await api(`/api/items/${qs.dataset.quickSave}/comps`, {json:{price,
        shipping:document.getElementById("qc-ship").value || 0,
        date: today(), source:document.getElementById("qc-source").value}});
      closeSheet(); return refresh();
    }

    const mchip = t.closest("[data-mode]");
    if(mchip){
      mode = mchip.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach(c=>c.setAttribute("aria-pressed", c===mchip));
      document.getElementById("items-toolbar").style.display = mode==="deals" ? "none" : "flex";
      document.getElementById("filters-items").style.display = mode==="deals" ? "none" : "flex";
      document.getElementById("deal-toolbar").style.display = mode==="deals" ? "flex" : "none";
      if(mode==="deals" && !cardDeals) await loadCardDeals();
      return renderRows();
    }
    const chip = t.closest("[data-filter]");
    if(chip){
      filter = chip.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(c=>c.setAttribute("aria-pressed", c===chip));
      renderRows();
    }
  }catch(err){ if(err.message!=="401") alert("Échec : "+err.message); }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target.closest(".sheet") && e.target.tagName==="INPUT"){
    const b = document.querySelector(".sheet .btn.primary"); if(b) b.click();
  }
  const row = e.target.closest("[data-open]");
  if(row && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); itemSheet(row.dataset.open); }
});
document.getElementById("search").addEventListener("input", e=>{ query = e.target.value.toLowerCase().trim(); if(S) renderRows(); });
document.getElementById("file").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  const fd = new FormData(); fd.append("file", f);
  try{
    if(!confirm("L'import remplace le contenu actuel de la base. Continuer ?")) return;
    await api("/api/import",{method:"POST", body:fd}); await refresh();
  }catch(err){ alert("Import impossible : "+err.message); }
  finally{ e.target.value=""; }
});
// Upload de photos depuis la fiche item (le <input id="photo-file"> vit dans la sheet).
// Delegation via document pour capturer les changes des inputs re-rendus.
document.addEventListener("change", async e=>{
  if(e.target.id!=="photo-file") return;
  const iid = e.target.dataset.item;
  const files = Array.from(e.target.files||[]);
  e.target.value = "";
  if(!files.length || !iid) return;
  try{
    for(const f of files){
      if(f.size > 10*1024*1024){ alert(`${f.name} > 10 Mo, ignoré`); continue; }
      const fd = new FormData(); fd.append("file", f);
      await api(`/api/items/${iid}/photos`,{method:"POST", body:fd});
    }
    await refresh(); return itemSheet(iid);
  }catch(err){ alert("Upload impossible : "+err.message); }
});

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !document.querySelector(".sheet")) refresh(); });

refresh();
</script>
