<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Portefeuille Pokémon</title>
<style>
:root{
  --ink:#0F1114; --panel:#17191D; --line:#24272C;
  --text:#ECEEF1; --muted:#8A8F97; --accent:#3EDC7B; --loss:#FF6B5E;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:var(--ink);color:var(--text);font-family:var(--sans)}
.card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:19px;margin:8px 0 22px;letter-spacing:-.01em;font-weight:650}
label{display:block;margin-bottom:16px}
.lb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px;
  color:var(--text);font-size:16px;font-family:inherit;min-height:44px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;padding:13px;min-height:44px;border-radius:10px;border:1px solid var(--accent);
  background:var(--accent);color:#06120B;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.err{color:var(--loss);font-size:13px;margin:0 0 12px;min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">Accès privé</span>
  <h1>Portefeuille Pokémon</h1>
  <p class="err" id="err" role="alert"></p>
  <label><span class="lb">Mot de passe</span>
    <input id="pw" type="password" autocomplete="current-password" autofocus></label>
  <button id="go">Ouvrir</button>
</div>
<script>
const go = document.getElementById("go"), pw = document.getElementById("pw"), err = document.getElementById("err");
async function login(){
  err.textContent = ""; go.disabled = true;
  try{
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password: pw.value})});
    if(r.ok){ location.replace("/"); return; }
    const d = await r.json().catch(()=>({}));
    err.textContent = d.detail || "Mot de passe incorrect";
  }catch(e){ err.textContent = "Serveur injoignable"; }
  go.disabled = false; pw.select();
}
go.addEventListener("click", login);
pw.addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
</script>
</body>
</html>
